[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scb-check"
version = "0.1.3"
description = "CLI for measuring verbosity and erosion metrics in supported source codebases"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ast-grep-cli==0.42.1",
    "typer==0.24.2",
    "structlog==25.5.0",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "pyyaml==6.0.3",
    "pydantic==2.13.3",
    "tree-sitter-rust==0.24.2",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
    "tree-sitter-zig==1.1.2",
    "tree-sitter-haskell==0.23.1",
    "tree-sitter-cpp==0.23.4",
]

[project.urls]
Repository = "https://github.com/gabeorlanski/scb-check"
Issues = "https://github.com/gabeorlanski/scb-check/issues"

[project.scripts]
scb-check = "scb_check.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-snapshot==0.9.0",
    "ruff==0.15.11",
    "ty==0.0.32",
    "vulture==2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scb_check"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: integration tests that require external tools",
]

[tool.ty.src]
exclude = ["tests/fixtures/"]

[tool.scb-check]
exclude = ["scratch/**", "tests/**"]

[tool.ruff]
exclude = [".venv", ".gitignore", ".dockerignore"]
line-length = 80
target-version = "py312"
extend-exclude = ["tests/fixtures/", ".venv/*", ".pytest_cache/*"]
show-fixes = true

[tool.ruff.lint.isort]
case-sensitive = true
force-single-line = true
single-line-exclusions = ["typing"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "TC001",
    "TC003",
    "E501",
    "C408",
    "EM101",
    "EM102",
    "TRY003",
    "COM812"
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["E402"]
"tests/**.py" = [
    "S101",
    "D100",
    "INP001",
    "PLR2004",
    "ARG005",
    "FLY002",
]


[tool.ruff.lint.pydocstyle]
convention = "google"  # Options: "google", "numpy", or "pep257"

[tool.vulture]
paths = ["src/scb_check"]
min_confidence = 80
exclude = [
    ".venv",
    ".pytest_cache",
    "scratch",
    "tests/fixtures",
]
