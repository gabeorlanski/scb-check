[package]
name = "scb-check"
version = "0.2.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
ast-grep-config = "0.43.0"
ast-grep-core = "0.43.0"
ast-grep-language = { version = "0.43.0", default-features = false, features = ["tree-sitter-python", "tree-sitter-rust"] }
ariadne = "0.5"
blake3 = "1.5"
clap = { version = "4.5.51", features = ["derive"] }
globset = "0.4.18"
ignore = "0.4.26"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9.8"
tree-sitter = "0.26.9"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"
insta = { version = "1", features = ["json"] }
predicates = "3"
